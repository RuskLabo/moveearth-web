name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Mermaid diagrams are rendered to SVG during the build, which needs a
      # real browser. Without this step the build fails on the first page that
      # has a diagram on it.
      - name: Install Chromium for diagram rendering
        run: npx playwright install --with-deps chromium

      - name: Check Astro project
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Markdown that fails to close an emphasis still builds and still
      # deploys; the stars just appear on the page. This reads the output.
      - name: Check built pages
        run: npm run check:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
